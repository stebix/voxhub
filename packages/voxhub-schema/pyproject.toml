[project]
name = 'voxhub-schema'
version = '0.1.0'
description = 'Protocol contract, ontology definitions, and validation for voxhub'
requires-python = '>=3.12'
dependencies = [
    'attrs>=25.4.0',
    'numpy>=2.4.0',
    'pynrrd>=1.1.3',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/voxhub_schema']

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="pl-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- header -->
  <rect x="64" y="50" width="16" height="16" rx="4" fill="#2563eb"/>
  <text x="92" y="67" font-size="30" font-weight="700" fill="#0f172a">Pull — getting data to annotate</text>
  <text x="92" y="93" font-size="15" fill="#64748b">The client asks the server for data; the server stages it; rsync brings it down</text>
  <rect x="1126" y="50" width="90" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1171" y="69" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">PULL</text>

  <!-- command pill -->
  <rect x="64" y="128" width="560" height="34" rx="8" fill="#0f172a"/>
  <text x="84" y="151" font-size="14" fill="#e2e8f0" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">voxhub pull  user@host  ./staging  --ontologies ...</text>

  <!-- legend -->
  <circle cx="700" cy="145" r="6" fill="#2563eb"/><text x="714" y="150" font-size="13" fill="#475569">client action</text>
  <circle cx="830" cy="145" r="6" fill="#0d9488"/><text x="844" y="150" font-size="13" fill="#475569">server action</text>
  <circle cx="965" cy="145" r="6" fill="#94a3b8"/><text x="979" y="150" font-size="13" fill="#475569">transfer / local</text>

  <!-- step cards -->
  <!-- 1 -->
  <rect x="64" y="210" width="208" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="64" y="210" width="6" height="220" rx="3" fill="#2563eb"/>
  <circle cx="100" cy="244" r="14" fill="#2563eb"/><text x="100" y="249" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="124" y="249" font-size="16" font-weight="700" fill="#0f172a">list-stores</text>
  <rect x="84" y="266" width="120" height="22" rx="11" fill="#eff6ff"/><text x="144" y="281" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">client to server</text>
  <text x="84" y="318" font-size="12.5" fill="#475569">Ask what stores exist.</text>
  <text x="84" y="338" font-size="12.5" fill="#475569">Get the catalog plus</text>
  <text x="84" y="358" font-size="12.5" fill="#475569">existing annotations.</text>

  <!-- 2 -->
  <rect x="292" y="210" width="208" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="292" y="210" width="6" height="220" rx="3" fill="#0d9488"/>
  <circle cx="328" cy="244" r="14" fill="#0d9488"/><text x="328" y="249" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="352" y="249" font-size="16" font-weight="700" fill="#0f172a">prepare-pull</text>
  <rect x="312" y="266" width="120" height="22" rx="11" fill="#f0fdfa"/><text x="372" y="281" font-size="11" font-weight="700" fill="#0d9488" text-anchor="middle">server stages</text>
  <text x="312" y="318" font-size="12.5" fill="#475569">Server writes each volume</text>
  <text x="312" y="338" font-size="12.5" fill="#475569">to NRRD in its own staging</text>
  <text x="312" y="358" font-size="12.5" fill="#475569">dir; checksums + ontologies.</text>

  <!-- 3 -->
  <rect x="520" y="210" width="208" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="520" y="210" width="6" height="220" rx="3" fill="#94a3b8"/>
  <circle cx="556" cy="244" r="14" fill="#94a3b8"/><text x="556" y="249" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="580" y="249" font-size="16" font-weight="700" fill="#0f172a">rsync pull</text>
  <rect x="540" y="266" width="120" height="22" rx="11" fill="#f1f5f9"/><text x="600" y="281" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">server to client</text>
  <text x="540" y="318" font-size="12.5" fill="#475569">Transfer staged NRRDs to</text>
  <text x="540" y="338" font-size="12.5" fill="#475569">your local folder. Re-pull</text>
  <text x="540" y="358" font-size="12.5" fill="#475569">skips unchanged files.</text>

  <!-- 4 -->
  <rect x="748" y="210" width="208" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="748" y="210" width="6" height="220" rx="3" fill="#0d9488"/>
  <circle cx="784" cy="244" r="14" fill="#0d9488"/><text x="784" y="249" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="808" y="249" font-size="16" font-weight="700" fill="#0f172a">cleanup</text>
  <rect x="768" y="266" width="120" height="22" rx="11" fill="#f0fdfa"/><text x="828" y="281" font-size="11" font-weight="700" fill="#0d9488" text-anchor="middle">client to server</text>
  <text x="768" y="318" font-size="12.5" fill="#475569">Server deletes its staging</text>
  <text x="768" y="338" font-size="12.5" fill="#475569">dir once the pull is</text>
  <text x="768" y="358" font-size="12.5" fill="#475569">acknowledged.</text>

  <!-- 5 -->
  <rect x="976" y="210" width="208" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="976" y="210" width="6" height="220" rx="3" fill="#2563eb"/>
  <circle cx="1012" cy="244" r="14" fill="#2563eb"/><text x="1012" y="249" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1036" y="249" font-size="16" font-weight="700" fill="#0f172a">manifest</text>
  <rect x="996" y="266" width="120" height="22" rx="11" fill="#eff6ff"/><text x="1056" y="281" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">local</text>
  <text x="996" y="318" font-size="12.5" fill="#475569">Record store metadata +</text>
  <text x="996" y="338" font-size="12.5" fill="#475569">expected ontologies; mark</text>
  <text x="996" y="358" font-size="12.5" fill="#475569">each store &quot;pulled&quot;.</text>

  <!-- arrows -->
  <line x1="274" y1="320" x2="290" y2="320" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#pl-slate)"/>
  <line x1="502" y1="320" x2="518" y2="320" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#pl-slate)"/>
  <line x1="730" y1="320" x2="746" y2="320" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#pl-slate)"/>
  <line x1="958" y1="320" x2="974" y2="320" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#pl-slate)"/>

  <!-- callouts -->
  <rect x="64" y="468" width="556" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="86" y="498" font-size="15" font-weight="700" fill="#0f172a">The server owns the staging path</text>
  <text x="86" y="524" font-size="13" fill="#475569">Clients never choose where data lives. The server hands back a</text>
  <text x="86" y="544" font-size="13" fill="#475569">collision-free path and the client just echoes it back later.</text>

  <rect x="640" y="468" width="544" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="662" y="498" font-size="15" font-weight="700" fill="#0f172a">Ontologies are chosen up front</text>
  <text x="662" y="524" font-size="13" fill="#475569">--ontologies fixes intent at pull time and guides the annotator</text>
  <text x="662" y="544" font-size="13" fill="#475569">toward the right label schema — enforced later at push.</text>

  <text x="64" y="700" font-size="12" fill="#94a3b8">voxhub — collaborative volumetric annotation</text>
</svg>

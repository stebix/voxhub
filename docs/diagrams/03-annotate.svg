<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="an-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- header -->
  <rect x="64" y="50" width="16" height="16" rx="4" fill="#0d9488"/>
  <text x="92" y="67" font-size="30" font-weight="700" fill="#0f172a">Annotate — guided work in 3D Slicer</text>
  <text x="92" y="93" font-size="15" fill="#64748b">You annotate locally; the ontology tells you exactly which structures to produce</text>
  <rect x="1086" y="50" width="130" height="28" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="1151" y="69" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">ANNOTATE</text>

  <!-- input column -->
  <text x="64" y="150" font-size="14" font-weight="700" fill="#64748b">YOU START WITH</text>
  <rect x="64" y="166" width="256" height="118" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <g transform="translate(88,196)"><rect x="0" y="6" width="34" height="34" rx="4" fill="#fffbeb" stroke="#d97706"/><path d="M0,6 L17,0 L51,0 L34,6 Z" fill="#fde68a" stroke="#d97706"/><path d="M34,6 L51,0 L51,34 L34,40 Z" fill="#fcd34d" stroke="#d97706"/></g>
  <text x="150" y="210" font-size="15" font-weight="700" fill="#0f172a">Staged volume</text>
  <text x="150" y="232" font-size="12.5" fill="#475569">raw CT as a .nrrd file</text>
  <text x="150" y="252" font-size="12.5" fill="#475569">delivered by pull</text>

  <rect x="64" y="300" width="256" height="118" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <g transform="translate(88,330)"><rect x="0" y="0" width="30" height="38" rx="3" fill="#eff6ff" stroke="#2563eb"/><line x1="6" y1="9" x2="24" y2="9" stroke="#2563eb" stroke-width="2"/><line x1="6" y1="17" x2="24" y2="17" stroke="#2563eb" stroke-width="2"/><line x1="6" y1="25" x2="18" y2="25" stroke="#2563eb" stroke-width="2"/></g>
  <text x="150" y="344" font-size="15" font-weight="700" fill="#0f172a">Pull manifest</text>
  <text x="150" y="366" font-size="12.5" fill="#475569">expected ontologies,</text>
  <text x="150" y="386" font-size="12.5" fill="#475569">e.g. inner-ear-structures</text>

  <!-- slicer panel -->
  <rect x="384" y="150" width="512" height="288" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="384" y="150" width="512" height="40" rx="14" fill="#0d9488"/>
  <rect x="384" y="172" width="512" height="18" fill="#0d9488"/>
  <text x="406" y="176" font-size="15" font-weight="700" fill="#ffffff">3D Slicer — annotation session</text>
  <!-- viewport -->
  <rect x="406" y="206" width="286" height="214" rx="8" fill="#0b1220"/>
  <circle cx="549" cy="313" r="92" fill="#1e293b" stroke="#334155"/>
  <ellipse cx="520" cy="300" rx="34" ry="24" fill="#ef4444" opacity="0.85"/>
  <ellipse cx="575" cy="330" rx="22" ry="18" fill="#3b82f6" opacity="0.85"/>
  <path d="M560,280 q30,-6 34,26 q2,22 -22,24 q-6,-30 -12,-50 Z" fill="#f59e0b" opacity="0.85"/>
  <text x="549" y="408" font-size="11" fill="#64748b" text-anchor="middle">painted segmentation overlay</text>
  <!-- label palette -->
  <text x="712" y="218" font-size="12" font-weight="700" fill="#64748b">LABELS (from ontology)</text>
  <rect x="712" y="230" width="14" height="14" rx="3" fill="#94a3b8"/><text x="734" y="242" font-size="13" fill="#334155">0  background</text>
  <rect x="712" y="256" width="14" height="14" rx="3" fill="#ef4444"/><text x="734" y="268" font-size="13" fill="#334155">1  cochlea</text>
  <rect x="712" y="282" width="14" height="14" rx="3" fill="#3b82f6"/><text x="734" y="294" font-size="13" fill="#334155">2  vestibule</text>
  <rect x="712" y="308" width="14" height="14" rx="3" fill="#f59e0b"/><text x="734" y="320" font-size="13" fill="#334155">3  semicircular canals</text>
  <line x1="712" y1="342" x2="876" y2="342" stroke="#e2e8f0"/>
  <text x="712" y="364" font-size="12" font-weight="700" fill="#64748b">OR LANDMARKS</text>
  <circle cx="719" cy="384" r="5" fill="#7c3aed"/><text x="734" y="389" font-size="13" fill="#334155">round window</text>
  <circle cx="719" cy="406" r="5" fill="#7c3aed"/><text x="734" y="411" font-size="13" fill="#334155">oval window</text>

  <!-- output column -->
  <text x="960" y="150" font-size="14" font-weight="700" fill="#64748b">YOU PRODUCE</text>
  <rect x="960" y="166" width="256" height="118" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="984" y="200" font-size="15" font-weight="700" fill="#0f172a">segmentation</text>
  <text x="984" y="220" font-size="12.5" font-family="'SFMono-Regular',Consolas,monospace" fill="#0d9488">*.seg.nrrd</text>
  <text x="984" y="248" font-size="12.5" fill="#475569">multi-label mask, one</text>
  <text x="984" y="268" font-size="12.5" fill="#475569">value per structure</text>

  <rect x="960" y="300" width="256" height="118" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="984" y="334" font-size="15" font-weight="700" fill="#0f172a">landmarks</text>
  <text x="984" y="354" font-size="12.5" font-family="'SFMono-Regular',Consolas,monospace" fill="#7c3aed">*.mrk.json</text>
  <text x="984" y="382" font-size="12.5" fill="#475569">named points in a known</text>
  <text x="984" y="402" font-size="12.5" fill="#475569">coordinate system (LPS)</text>

  <!-- flow arrows -->
  <line x1="322" y1="225" x2="380" y2="240" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#an-slate)"/>
  <line x1="322" y1="356" x2="380" y2="330" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#an-slate)"/>
  <line x1="900" y1="240" x2="956" y2="225" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#an-slate)"/>
  <line x1="900" y1="330" x2="956" y2="356" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#an-slate)"/>

  <!-- value strip -->
  <rect x="64" y="478" width="1152" height="86" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="88" y="512" font-size="16" font-weight="700" fill="#115e59">Guided &amp; conformant by design</text>
  <text x="88" y="540" font-size="13.5" fill="#334155">The ontology fixes the label set (or point names) before you start — so every annotation is consistent, comparable, and</text>
  <text x="88" y="560" font-size="13.5" fill="#334155">queryable downstream. Conformance is checked automatically at push, before anything reaches the server.</text>

  <text x="64" y="700" font-size="12" fill="#94a3b8">voxhub — collaborative volumetric annotation</text>
</svg>
